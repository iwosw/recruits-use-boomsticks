buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

def stressProfile = (project.findProperty('stress') ?: 'baseline').toString()
def stressProfiles = ['baseline', 'musket', 'combat', 'optimization', 'all']
if (!stressProfiles.contains(stressProfile)) {
    throw new GradleException("Unknown stress profile '${stressProfile}'. Expected one of ${stressProfiles}")
}
def stressIncludes = { String candidate -> stressProfile == candidate || stressProfile == 'all' }
def artilleryProfile = (project.findProperty('artillery') ?: '1.16.2').toString()
def artilleryFiles = [
        '1.11'  : '7455014',
        '1.11.1': '7490351',
        '1.12'  : '7675822',
        '1.13'  : '8021226',
        '1.13.1': '8021524',
        '1.13.2': '8039277',
        '1.13.3': '8051642',
        '1.13.4': '8252195',
        '1.14'  : '8325660',
        '1.15.2': '8682920',
        '1.16.2': '8812944'
]
def artilleryProfiles = ['none'] + artilleryFiles.keySet()
if (!artilleryProfiles.contains(artilleryProfile)) {
    throw new GradleException("Unknown Artillery profile '${artilleryProfile}'. Expected one of ${artilleryProfiles}")
}
def artilleryFile = artilleryFiles[artilleryProfile]
def artilleryDevPatch = (project.findProperty('artilleryDevPatch') ?: 'true').toString().toBoolean()
def dependencyMatrixProfile = (project.findProperty('matrix') ?: 'default').toString()
        .replaceAll('[^A-Za-z0-9_.-]', '_')
def recruitsVersion = (project.findProperty('recruitsVersion') ?: '1.15.2').toString()
def medievalBoomsticksFile = (project.findProperty('medievalBoomsticksFile') ?: '5832925').toString()
def includeMedievalBoomsticks = (project.findProperty('includeMedievalBoomsticks') ?: 'true')
        .toString().toBoolean()
def geckolibFile = (project.findProperty('geckolibFile') ?: '8285794').toString()
def epicKnightsVersion = (project.findProperty('epicKnightsVersion') ?: '2kK9qUpx').toString()
def architecturyVersion = (project.findProperty('architecturyVersion') ?: '9.2.14+forge').toString()
def clothConfigVersion = (project.findProperty('clothConfigVersion') ?: '11.1.136+forge').toString()
def includeEpicKnightsAddon = (project.findProperty('includeEpicKnightsAddon') ?: 'true').toString().toBoolean()
def includeBetterFormations = (project.findProperty('includeBetterFormations') ?: 'true').toString().toBoolean()
def recruitsVersionRange = (project.findProperty('recruitsVersionRange') ?: '[1.15,1.16)').toString()
def medievalBoomsticksVersionRange = (project.findProperty('medievalBoomsticksVersionRange') ?: '[1.01,1.3)').toString()
def geckolibVersionRange = (project.findProperty('geckolibVersionRange') ?: '[4.2.4,4.9)').toString()
def epicKnightsVersionRange = (project.findProperty('epicKnightsVersionRange') ?: '[8.2,11)').toString()
def architecturyVersionRange = (project.findProperty('architecturyVersionRange') ?: '[9.0.8,10)').toString()
def clothConfigVersionRange = (project.findProperty('clothConfigVersionRange') ?: '[11.0.99,13)').toString()
def artilleryVersionRange = (project.findProperty('artilleryVersionRange')
        ?: '[1.11,1.14),[1.15.2,1.16),[1.16.2]').toString()
def gameTestDirectory = "run-gametest-${stressProfile}-artillery-${artilleryProfile}-matrix-${dependencyMatrixProfile}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            if (stressProfile != 'baseline') {
                workingDirectory project.file("run-client-${stressProfile}")
            }
        }

        server {
            if (!includeMedievalBoomsticks) {
                workingDirectory project.file("run-server-no-medieval-boomsticks-${stressProfile}")
            } else if (stressProfile != 'baseline') {
                workingDirectory project.file("run-server-${stressProfile}")
            }
            args '--nogui'
            if (project.hasProperty('serverPort')) {
                args '--port', project.property('serverPort').toString()
            }
        }

        gameTestServer {
            workingDirectory project.file(gameTestDirectory)
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // Development-only. It strips the client-only listeners that stop Artillery 1.14 from loading on
    // a dedicated server, so runGameTestServer -Partillery=1.14 can compare it with the current
    // unpatched server-safe 1.16.2 artifact. It is deliberately absent from the release jar's
    // MixinConfigs manifest entry below: patching another mod's binary for players would make this
    // project answerable for Artillery's server stability.
    if (artilleryProfile == '1.14' && artilleryDevPatch) {
        config "${mod_id}.artillery-dev.mixins.json"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}

// Artillery Addon runtime artifact. -Partillery=none proves the optional-dependency path.
// 8812944 (1.16.2) is the dedicated-server release baseline and registers all twenty-four
// supported firearm profiles. 8325660 (1.14.0) still fails dedicated-server loading upstream and may run
// GameTests only through the dev-only patch configured above. 8252195 (1.13.4) remains available for
// the older supported range.
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("maven.modrinth:villager-recruits:${recruitsVersion}")
    // Compile against the typed integration, but do not make either jar part of the core runtime.
    // -PincludeMedievalBoomsticks=false exercises the Artillery-only installation.
    compileOnly fg.deobf("curse.maven:medieval-boomsticks-1123016:${medievalBoomsticksFile}")
    compileOnly fg.deobf("curse.maven:geckolib-388172:${geckolibFile}")
    if (includeMedievalBoomsticks) {
        runtimeOnly fg.deobf("curse.maven:medieval-boomsticks-1123016:${medievalBoomsticksFile}")
        runtimeOnly fg.deobf("curse.maven:geckolib-388172:${geckolibFile}")
    }
    if (artilleryFile != null) {
        runtimeOnly fg.deobf("curse.maven:epic-knights-artillery-addon-1307540:${artilleryFile}")
    }
    runtimeOnly fg.deobf("maven.modrinth:epic-knights-shields-armor-and-weapons:${epicKnightsVersion}")
    if (includeEpicKnightsAddon) {
        runtimeOnly fg.deobf('maven.modrinth:epic-knights-addon:xnYQSIH7')
    }
    if (includeBetterFormations) {
        runtimeOnly fg.deobf('curse.maven:betterrecruitformations-1599988:8396882')
    }
    runtimeOnly fg.deobf("maven.modrinth:architectury-api:${architecturyVersion}")
    runtimeOnly fg.deobf("maven.modrinth:cloth-config:${clothConfigVersion}")

    // Opt-in compatibility stress profiles. These dependencies exercise competing combat AI,
    // animation/combat hooks, and invasive optimization Mixins without entering the release jar.
    if (stressIncludes('musket')) {
        runtimeOnly fg.deobf('maven.modrinth:musket-mod:TMhHD4WK')
    }
    if (stressIncludes('combat')) {
        runtimeOnly fg.deobf('maven.modrinth:better-combat:UjlaL0Fm')
        runtimeOnly fg.deobf('maven.modrinth:playeranimator:xe2EVE6q')
    }
    if (stressIncludes('optimization')) {
        runtimeOnly fg.deobf('maven.modrinth:modernfix:X5IBt7e3')
        runtimeOnly fg.deobf('maven.modrinth:ferrite-core:DG5Fn9Sz')
        runtimeOnly fg.deobf('maven.modrinth:ai-improvements:eJihmpNQ')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        if (artilleryProfile == '1.14' && artilleryDevPatch) {
            // 1.14 needs the development-only mixin config above to load on a dedicated server at
            // all. The release boundary is the unpatched 8812944 (1.16.2) run.
            logger.lifecycle('Running GameTests against Artillery 1.14 (8325660) with the '
                    + 'development-only dedicated-server patch. The release claim stays with the '
                    + 'unpatched 8812944 (1.16.2) run.')
        }
        delete file("${gameTestDirectory}/logs/latest.log")
    }
    doLast {
        def gameTestLog = file("${gameTestDirectory}/logs/latest.log")
        if (!gameTestLog.exists()) {
            throw new GradleException('GameTest log was not created')
        }
        def output = gameTestLog.getText('UTF-8')
        def requiredTests = 143
        if (output.contains('Failed to load datapacks')
                || !output.contains("${requiredTests} tests are now running")
                || !output.contains("All ${requiredTests} required tests passed")) {
            throw new GradleException(
                    "GameTest harness did not execute and pass all ${requiredTests} required tests")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            recruits_version_range : recruitsVersionRange,
            medieval_boomsticks_version_range: medievalBoomsticksVersionRange,
            geckolib_version_range : geckolibVersionRange,
            epic_knights_version_range: epicKnightsVersionRange,
            architectury_version_range: architecturyVersionRange,
            cloth_config_version_range: clothConfigVersionRange,
            artillery_version_range: artilleryVersionRange
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // The Artillery 1.14 dedicated-server patch is verification scaffolding. Development runs read
    // it straight from the build directory, so keeping it out of the release artifact costs nothing
    // and leaves no inert patch of another mod's binary inside a published jar.
    exclude "${mod_id}.artillery-dev.mixins.json"
    exclude 'org/iwoss/recruits_use_boomsticks/mixin/artillery/**'

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
