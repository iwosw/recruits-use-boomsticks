buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    // Development-only. It strips the client-only listeners that stop Artillery 1.14 from loading on
    // a dedicated server, so runGameTestServer -Partillery=1.14 can execute the tests that the
    // pinned 1.11 artifact leaves dependency-gated. It is deliberately absent from the release jar's
    // MixinConfigs manifest entry below: patching another mod's binary for players would make this
    // project answerable for Artillery's server stability.
    config "${mod_id}.artillery-dev.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}

// Artillery Addon runtime artifact. 7455014 (1.11) is the pinned server-safe file the GameTest
// harness is validated against; it does not register Tiller Gun, Noble Handgonne, Hackbut, or
// Double Barrel Gonne. 8325660 (1.14.0) registers all seventeen guns but fails dedicated-server
// loading upstream, so it is opt-in and client-only: ./gradlew runClient -Partillery=1.14
def artilleryFile = project.findProperty('artillery') == '1.14' ? '8325660' : '7455014'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf('maven.modrinth:villager-recruits:1.15.2')
    implementation fg.deobf('curse.maven:medieval-boomsticks-1123016:5832925')
    implementation fg.deobf('curse.maven:geckolib-388172:7553267')
    runtimeOnly fg.deobf("curse.maven:epic-knights-artillery-addon-1307540:${artilleryFile}")
    runtimeOnly fg.deobf('maven.modrinth:epic-knights-shields-armor-and-weapons:2kK9qUpx')
    runtimeOnly fg.deobf('maven.modrinth:architectury-api:9.2.14+forge')
    runtimeOnly fg.deobf('maven.modrinth:cloth-config:11.1.118+forge')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        if (artilleryFile != '7455014') {
            // 1.14 needs the development-only mixin config above to load on a dedicated server at
            // all. The release boundary is still the pinned 7455014 run; this variant exists to
            // execute the tests that artifact cannot register.
            logger.lifecycle('Running GameTests against Artillery 1.14 (8325660) with the '
                    + 'development-only dedicated-server patch. The release claim stays with the '
                    + 'pinned 7455014 run.')
        }
        delete file('run/logs/latest.log')
    }
    doLast {
        def gameTestLog = file('run/logs/latest.log')
        if (!gameTestLog.exists()) {
            throw new GradleException('GameTest log was not created')
        }
        def output = gameTestLog.getText('UTF-8')
        def requiredTests = 109
        if (output.contains('Failed to load datapacks')
                || !output.contains("${requiredTests} tests are now running")
                || !output.contains("All ${requiredTests} required tests passed")) {
            throw new GradleException(
                    "GameTest harness did not execute and pass all ${requiredTests} required tests")
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description       : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }

    // The Artillery 1.14 dedicated-server patch is verification scaffolding. Development runs read
    // it straight from the build directory, so keeping it out of the release artifact costs nothing
    // and leaves no inert patch of another mod's binary inside a published jar.
    exclude "${mod_id}.artillery-dev.mixins.json"
    exclude 'org/iwoss/recruits_use_boomsticks/mixin/artillery/**'

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
